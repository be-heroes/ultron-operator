# permissions for end users to view ultrons.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ultron-operator
    app.kubernetes.io/managed-by: kustomize
  name: ultron-viewer-role
rules:
- apiGroups:
  - ultron.2mind.dk
  resources:
  - ultrons
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ultron.2mind.dk
  resources:
  - ultrons/status
  verbs:
  - get
